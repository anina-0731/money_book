<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能记账系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { 
            background-color: #FAF8F5; 
            color: #4A4A4A; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        .card { 
            background: #FFFFFF; 
            border-radius: 1.5rem; 
            border: 1px solid #F0ECE1; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.02); 
        }
        .btn-primary { 
            background-color: #8E9AAF; 
            color: white; 
            transition: all 0.2s ease; 
        }
        .btn-primary:hover { 
            background-color: #7B889B; 
            transform: translateY(-1px); 
        }
        .tab-btn {
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: #8E9AAF;
            color: white;
            font-weight: 600;
        }
    </style>
</head>
<body class="p-4 md:p-8 max-w-6xl mx-auto">

    <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
        <div>
            <h1 class="text-3xl font-bold text-gray-700 flex items-center gap-2">
                <span>🍃</span> 静蜜记账
            </h1>
            <p class="text-xs text-gray-400 mt-1">安静·极简·多途径追踪·数据本地保存</p>
        </div>
        
        <div class="flex flex-wrap gap-2">
            <button onclick="downloadTemplate()" class="px-4 py-2 bg-emerald-50 text-emerald-600 border border-emerald-100 rounded-xl text-xs hover:bg-emerald-100 transition flex items-center gap-1 font-medium">
                📥 下载标准 Excel 模板
            </button>
            <button onclick="exportJSON()" class="px-4 py-2 bg-white text-gray-600 border border-gray-200 rounded-xl text-xs hover:bg-gray-50 transition">
                📤 导出备份 (.json)
            </button>
            <label class="px-4 py-2 bg-white text-gray-600 border border-gray-200 rounded-xl text-xs hover:bg-gray-50 transition cursor-pointer">
                📥 导入备份 (.json)
                <input type="file" accept=".json" onchange="importJSON(event)" class="hidden">
            </label>
        </div>
    </header>

    <div class="flex gap-2 p-1 bg-gray-100 rounded-2xl mb-6 w-fit text-sm">
        <button id="tab-overview" onclick="switchTab('overview')" class="tab-btn active px-5 py-2 rounded-xl">收支明细</button>
        <button id="tab-monthly" onclick="switchTab('monthly')" class="tab-btn px-5 py-2 rounded-xl">月度分析</button>
        <button id="tab-yearly" onclick="switchTab('yearly')" class="tab-btn px-5 py-2 rounded-xl">年度报告</button>
    </div>

    <div id="view-overview" class="space-y-6">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="card p-6 md:col-span-2 border-dashed border-2 border-amber-200 bg-amber-50/20">
                <h2 class="text-base font-semibold mb-1 flex items-center gap-2 text-amber-800">
                    <span>📄</span> 批量导入账单 (微信 / 支付宝 / 银行卡 Excel / CSV)
                </h2>
                <p class="text-xs text-gray-400 mb-4">自动去除微信/支付宝开头的无关声明行，智能识别金额、日期、渠道与分类。</p>
                
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="file" id="billFileInput" accept=".csv, .xls, .xlsx" class="block w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-amber-100 file:text-amber-700 hover:file:bg-amber-200 cursor-pointer">
                    <button onclick="parseBillFile()" class="px-5 py-2 btn-primary rounded-xl text-xs shrink-0 font-medium">开始智能解析</button>
                </div>
                <div id="importMsg" class="mt-2 text-xs"></div>
            </div>

            <div class="card p-6 flex flex-col justify-between">
                <div>
                    <span class="text-xs text-gray-400">本月结余 (元)</span>
                    <div id="totalBalance" class="text-3xl font-bold text-gray-800 mt-1">¥ 0.00</div>
                </div>
                <div class="flex justify-between text-xs text-gray-500 pt-3 border-t border-gray-100 mt-4">
                    <div>收入: <span id="totalIncome" class="text-emerald-600 font-semibold">¥0.00</span></div>
                    <div>支出: <span id="totalExpense" class="text-rose-500 font-semibold">¥0.00</span></div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="card p-6 h-fit">
                <h2 class="text-base font-semibold mb-4 text-gray-700">✍️ 记一笔</h2>
                <form id="addForm" onsubmit="handleAddTransaction(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">收支类型</label>
                        <select id="type" class="w-full p-2.5 rounded-xl border border-gray-200 text-xs focus:outline-none focus:border-gray-400">
                            <option value="支出">支出</option>
                            <option value="收入">收入</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">金额 (元)</label>
                        <input type="number" step="0.01" id="amount" required class="w-full p-2.5 rounded-xl border border-gray-200 text-xs focus:outline-none focus:border-gray-400" placeholder="0.00">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">支出/收入途径（账户）</label>
                        <select id="account" class="w-full p-2.5 rounded-xl border border-gray-200 text-xs focus:outline-none focus:border-gray-400">
                            <option value="微信支付">微信支付</option>
                            <option value="支付宝">支付宝</option>
                            <option value="招商银行">招商银行</option>
                            <option value="建设银行">建设银行</option>
                            <option value="现金/其他">现金/其他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">分类</label>
                        <input type="text" id="category" placeholder="如：餐饮、购物、娱乐、工资" required class="w-full p-2.5 rounded-xl border border-gray-200 text-xs focus:outline-none focus:border-gray-400">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">日期</label>
                        <input type="date" id="date" required class="w-full p-2.5 rounded-xl border border-gray-200 text-xs focus:outline-none focus:border-gray-400">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">备注 / 交易对方</label>
                        <input type="text" id="merchant" placeholder="如：星巴克、超市" class="w-full p-2.5 rounded-xl border border-gray-200 text-xs focus:outline-none focus:border-gray-400">
                    </div>
                    <button type="submit" class="w-full py-3 btn-primary rounded-xl text-xs font-medium mt-2">保存记录</button>
                </form>
            </div>

            <div class="card p-6 md:col-span-2">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-base font-semibold text-gray-700">收支明细账单</h2>
                    <button onclick="clearAllData()" class="text-xs text-rose-400 hover:underline">清空所有记录</button>
                </div>
                <div class="overflow-x-auto max-h-[520px] overflow-y-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-gray-50 text-gray-400 sticky top-0">
                            <tr>
                                <th class="p-3">日期</th>
                                <th class="p-3">分类/备注</th>
                                <th class="p-3">途径</th>
                                <th class="p-3">金额</th>
                                <th class="p-3 text-right">操作</th>
                            </tr>
                        </thead>
                        <tbody id="transactionList" class="divide-y divide-gray-100">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="view-monthly" class="hidden space-y-6">
        <div class="card p-6 flex flex-wrap justify-between items-center gap-4">
            <h2 class="text-base font-semibold text-gray-700">📅 月度分析</h2>
            <input type="month" id="monthlyPicker" onchange="renderMonthlyView()" class="p-2 border border-gray-200 rounded-xl text-xs focus:outline-none">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="card p-6">
                <h3 class="text-xs font-semibold text-gray-500 mb-4">当月支出分类占比</h3>
                <div class="h-64 flex justify-center items-center">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
            <div class="card p-6">
                <h3 class="text-xs font-semibold text-gray-500 mb-4">各途径支付占比</h3>
                <div class="h-64 flex justify-center items-center">
                    <canvas id="accountChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div id="view-yearly" class="hidden space-y-6">
        <div class="card p-6 flex justify-between items-center">
            <h2 class="text-base font-semibold text-gray-700">📊 年度财务报告</h2>
            <select id="yearlyPicker" onchange="renderYearlyView()" class="p-2 border border-gray-200 rounded-xl text-xs focus:outline-none">
                </select>
        </div>

        <div class="card p-6">
            <h3 class="text-xs font-semibold text-gray-500 mb-4">全年 12 个月收支趋势对比</h3>
            <div class="h-72">
                <canvas id="yearlyTrendChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // 本地存储数组
        let transactions = JSON.parse(localStorage.getItem('my_transactions') || '[]');

        // Chart 图表实例变量
        let categoryChartInstance = null;
        let accountChartInstance = null;
        let yearlyChartInstance = null;

        // 初始化
        document.getElementById('date').valueAsDate = new Date();
        document.getElementById('monthlyPicker').value = new Date().toISOString().slice(0, 7);

        function saveAndRender() {
            localStorage.setItem('my_transactions', JSON.stringify(transactions));
            renderList();
            renderSummary();
        }

        // 视图切换
        function switchTab(tab) {
            ['overview', 'monthly', 'yearly'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).classList.remove('active');
            });

            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).classList.add('active');

            if (tab === 'monthly') renderMonthlyView();
            if (tab === 'yearly') {
                populateYearPicker();
                renderYearlyView();
            }
        }

        // 渲染列表
        function renderList() {
            const tbody = document.getElementById('transactionList');
            if (transactions.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-gray-300">暂无数据，可手动添加或批量导入账单</td></tr>`;
                return;
            }

            tbody.innerHTML = transactions.map((t, index) => {
                const isExpense = t.type === '支出';
                const isRefunded = t.is_refunded;
                return `
                    <tr class="hover:bg-gray-50/50 ${isRefunded ? 'opacity-40 line-through' : ''}">
                        <td class="p-3 text-xs text-gray-400">${t.date}</td>
                        <td class="p-3">
                            <div class="font-medium text-gray-700">${t.category}</div>
                            <div class="text-xs text-gray-400">${t.merchant || '-'}</div>
                        </td>
                        <td class="p-3 text-xs"><span class="px-2 py-0.5 bg-gray-100 text-gray-600 rounded-md">${t.account || '默认账户'}</span></td>
                        <td class="p-3 font-semibold ${isExpense ? 'text-rose-500' : 'text-emerald-600'}">
                            ${isExpense ? '-' : '+'}${parseFloat(t.amount).toFixed(2)}
                        </td>
                        <td class="p-3 text-right space-x-2">
                            <button onclick="toggleRefund(${index})" class="text-xs text-amber-600 hover:underline">
                                ${isRefunded ? '取消对冲' : '🔄 退款对冲'}
                            </button>
                            <button onclick="deleteItem(${index})" class="text-xs text-rose-400 hover:underline">删除</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // 渲染顶部概要
        function renderSummary() {
            const currentMonth = new Date().toISOString().slice(0, 7);
            let totalIncome = 0;
            let totalExpense = 0;

            transactions.forEach(t => {
                if (t.is_refunded) return; // 退款对冲不统计
                if (t.date.startsWith(currentMonth)) {
                    const amt = parseFloat(t.amount) || 0;
                    if (t.type === '收入') totalIncome += amt;
                    if (t.type === '支出') totalExpense += amt;
                }
            });

            document.getElementById('totalIncome').innerText = `¥ ${totalIncome.toFixed(2)}`;
            document.getElementById('totalExpense').innerText = `¥ ${totalExpense.toFixed(2)}`;
            document.getElementById('totalBalance').innerText = `¥ ${(totalIncome - totalExpense).toFixed(2)}`;
        }

        // 手动添加
        function handleAddTransaction(e) {
            e.preventDefault();
            const item = {
                id: Date.now() + Math.random(),
                type: document.getElementById('type').value,
                amount: parseFloat(document.getElementById('amount').value),
                account: document.getElementById('account').value,
                category: document.getElementById('category').value,
                date: document.getElementById('date').value,
                merchant: document.getElementById('merchant').value,
                is_refunded: false
            };
            transactions.unshift(item);
            saveAndRender();
            e.target.reset();
            document.getElementById('date').valueAsDate = new Date();
        }

        function toggleRefund(index) {
            transactions[index].is_refunded = !transactions[index].is_refunded;
            saveAndRender();
        }

        function deleteItem(index) {
            transactions.splice(index, 1);
            saveAndRender();
        }

        function clearAllData() {
            if (confirm('确定清空所有本地记账记录吗？此操作不可撤销！')) {
                transactions = [];
                saveAndRender();
            }
        }

        // ================= 核心：SheetJS 账单智能解析模块 =================
        function parseBillFile() {
            const fileInput = document.getElementById('billFileInput');
            const msgBox = document.getElementById('importMsg');
            const file = fileInput.files[0];

            if (!file) {
                msgBox.className = "mt-2 text-xs text-rose-500 font-medium";
                msgBox.innerText = "⚠️ 请先选择要上传的 Excel (.xlsx/.xls) 或 CSV 账单文件！";
                return;
            }

            msgBox.className = "mt-2 text-xs text-gray-500";
            msgBox.innerText = "⏳ 正在分析文件表头并提取交易记录...";

            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const firstSheet = workbook.Sheets[firstSheetName];
                    const rawRows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                    // 1. 扫描定位关键表头所在行
                    let headerIndex = -1;
                    for (let i = 0; i < Math.min(rawRows.length, 30); i++) {
                        const rowStr = (rawRows[i] || []).map(cell => String(cell || '')).join(' ');
                        if (rowStr.includes('金额') || rowStr.includes('收/支') || rowStr.includes('交易时间') || rowStr.includes('记账日期')) {
                            headerIndex = i;
                            break;
                        }
                    }

                    if (headerIndex === -1) {
                        throw new Error("未能定位到有效表头，请确认文件中包含【金额】和【收/支】或【时间】列。");
                    }

                    const headers = rawRows[headerIndex].map(h => String(h || '').trim());
                    
                    // 多词匹配对应列索引
                    const getColIndex = (keywords) => headers.findIndex(h => keywords.some(k => h.includes(k)));

                    const idxDate = getColIndex(['时间', '日期', '创建时间', '记账']);
                    const idxType = getColIndex(['收/支', '收支', '类型', '收/付款']);
                    const idxAmount = getColIndex(['金额', '金额(元)']);
                    const idxCategory = getColIndex(['分类', '用途', '交易类型', '子类']);
                    const idxMerchant = getColIndex(['交易对方', '商品', '商户', '说明', '备注']);
                    const idxAccount = getColIndex(['支付方式', '收/付款方式', '渠道', '账户']);

                    if (idxAmount === -1) {
                        throw new Error("表格中未找到【金额】相关列！");
                    }

                    let parsedCount = 0;
                    for (let i = headerIndex + 1; i < rawRows.length; i++) {
                        const row = rawRows[i];
                        if (!row || row.length === 0) continue;

                        let amtStr = String(row[idxAmount] || '').replace(/¥|,|￥/g, '').trim();
                        let amt = parseFloat(amtStr);
                        if (isNaN(amt) || amt <= 0) continue;

                        let rawType = idxType !== -1 ? String(row[idxType] || '').trim() : '';
                        let type = '支出';
                        if (rawType.includes('收入')) type = '收入';

                        let rawDate = idxDate !== -1 ? row[idxDate] : new Date().toISOString().split('T')[0];
                        let formattedDate = String(rawDate).split(' ')[0].replace(/\//g, '-');

                        let category = idxCategory !== -1 && row[idxCategory] ? String(row[idxCategory]).trim() : '日常消费';
                        let merchant = idxMerchant !== -1 && row[idxMerchant] ? String(row[idxMerchant]).trim() : '';
                        let account = idxAccount !== -1 && row[idxAccount] ? String(row[idxAccount]).trim() : '微信/支付宝';

                        transactions.unshift({
                            id: Date.now() + Math.random(),
                            type: type,
                            amount: amt,
                            account: account,
                            category: category,
                            date: formattedDate,
                            merchant: merchant,
                            is_refunded: false
                        });
                        parsedCount++;
                    }

                    if (parsedCount === 0) {
                        throw new Error("未能读取到有效的交易数据，请检查金额是否填写真确。");
                    }

                    saveAndRender();
                    msgBox.className = "mt-2 text-xs text-emerald-600 font-semibold";
                    msgBox.innerText = `🎉 成功提取并导入 ${parsedCount} 笔交易记录！`;
                    fileInput.value = '';

                } catch (err) {
                    msgBox.className = "mt-2 text-xs text-rose-500 font-semibold";
                    msgBox.innerText = "❌ 识别失败: " + err.message;
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // 下载标准 Excel 模板
        function downloadTemplate() {
            const templateData = [
                ["交易时间", "收/支", "金额", "交易分类", "交易对方/备注", "支付方式"],
                ["2026-07-20", "支出", "35.50", "餐饮", "星巴克咖啡", "微信支付"],
                ["2026-07-21", "支出", "120.00", "交通", "加油站", "支付宝"],
                ["2026-07-25", "收入", "8000.00", "工资", "公司打款", "招商银行"]
            ];
            const ws = XLSX.utils.aoa_to_sheet(templateData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "记账模板");
            XLSX.writeFile(wb, "智能记账系统标准导入模板.xlsx");
        }

        // ================= 月度分析 & 年度报告渲染 =================
        function renderMonthlyView() {
            const selectedMonth = document.getElementById('monthlyPicker').value;
            const monthData = transactions.filter(t => !t.is_refunded && t.date.startsWith(selectedMonth) && t.type === '支出');

            // 1. 分类汇总
            const catMap = {};
            monthData.forEach(t => {
                catMap[t.category] = (catMap[t.category] || 0) + t.amount;
            });

            // 2. 途径汇总
            const accMap = {};
            monthData.forEach(t => {
                accMap[t.account] = (accMap[t.account] || 0) + t.amount;
            });

            // 渲染饼图 1 (分类)
            if (categoryChartInstance) categoryChartInstance.destroy();
            const ctxCat = document.getElementById('categoryChart').getContext('2d');
            categoryChartInstance = new Chart(ctxCat, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(catMap).length ? Object.keys(catMap) : ['暂无支出'],
                    datasets: [{
                        data: Object.values(catMap).length ? Object.values(catMap) : [1],
                        backgroundColor: ['#8E9AAF', '#CBC0D3', '#EFD3D7', '#FEEAFA', '#DEE2E6', '#A3C4BC']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // 渲染饼图 2 (途径)
            if (accountChartInstance) accountChartInstance.destroy();
            const ctxAcc = document.getElementById('accountChart').getContext('2d');
            accountChartInstance = new Chart(ctxAcc, {
                type: 'pie',
                data: {
                    labels: Object.keys(accMap).length ? Object.keys(accMap) : ['暂无数据'],
                    datasets: [{
                        data: Object.values(accMap).length ? Object.values(accMap) : [1],
                        backgroundColor: ['#A3C4BC', '#8E9AAF', '#F4ACB7', '#D8E2DC', '#FFE5D9']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function populateYearPicker() {
            const picker = document.getElementById('yearlyPicker');
            const years = Array.from(new Set(transactions.map(t => t.date.slice(0, 4)))).sort().reverse();
            const currentYear = new Date().getFullYear().toString();
            if (!years.includes(currentYear)) years.unshift(currentYear);

            picker.innerHTML = years.map(y => `<option value="${y}">${y} 年</option>`).join('');
        }

        function renderYearlyView() {
            const selectedYear = document.getElementById('yearlyPicker').value;
            const monthlyIncomes = new Array(12).fill(0);
            const monthlyExpenses = new Array(12).fill(0);

            transactions.forEach(t => {
                if (t.is_refunded || !t.date.startsWith(selectedYear)) return;
                const m = parseInt(t.date.slice(5, 7), 10) - 1;
                if (m >= 0 && m < 12) {
                    if (t.type === '收入') monthlyIncomes[m] += t.amount;
                    if (t.type === '支出') monthlyExpenses[m] += t.amount;
                }
            });

            if (yearlyChartInstance) yearlyChartInstance.destroy();
            const ctxYear = document.getElementById('yearlyTrendChart').getContext('2d');
            yearlyChartInstance = new Chart(ctxYear, {
                type: 'bar',
                data: {
                    labels: ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
                    datasets: [
                        { label: '收入', data: monthlyIncomes, backgroundColor: '#A3C4BC' },
                        { label: '支出', data: monthlyExpenses, backgroundColor: '#F4ACB7' }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // ================= JSON 导出与导入 =================
        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactions, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `静蜜记账备份_${new Date().toISOString().split('T')[0]}.json`);
            dlAnchorElem.click();
        }

        function importJSON(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const importedData = JSON.parse(event.target.result);
                    if (Array.isArray(importedData)) {
                        transactions = importedData;
                        saveAndRender();
                        alert('✅ 数据恢复成功！');
                    }
                } catch (err) {
                    alert('❌ 备份文件损坏或格式不符合！');
                }
            };
            reader.readAsText(file);
        }

        // 页面初始渲染
        saveAndRender();
    </script>
</body>
</html>
