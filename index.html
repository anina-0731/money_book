<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的荷包管家 - 智能记账系统 Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (用于 Excel / CSV 批量解析) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- PDF.js (用于 PDF 账单文本提取) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>
    <style>
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .tab-btn.active {
            border-bottom: 3px solid #3b82f6;
            color: #3b82f6;
            font-weight: 600;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen pb-12">

    <!-- 顶部导航与数据操作栏 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-wallet text-2xl text-blue-600"></i>
                <h1 class="text-xl font-bold text-slate-800">我的荷包管家 Pro</h1>
            </div>
            
            <!-- 数据备份/恢复与模板下载 -->
            <div class="flex items-center space-x-2 text-sm">
                <button onclick="downloadTemplate()" class="bg-emerald-50 text-emerald-600 border border-emerald-200 hover:bg-emerald-100 px-3 py-1.5 rounded-lg transition flex items-center space-x-1">
                    <i class="fa-solid fa-file-excel"></i>
                    <span>下载Excel模板</span>
                </button>
                <button onclick="exportBackup()" class="bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-100 px-3 py-1.5 rounded-lg transition flex items-center space-x-1">
                    <i class="fa-solid fa-download"></i>
                    <span>导出备份JSON</span>
                </button>
                <label class="bg-slate-100 text-slate-600 border border-slate-200 hover:bg-slate-200 px-3 py-1.5 rounded-lg cursor-pointer transition flex items-center space-x-1">
                    <i class="fa-solid fa-upload"></i>
                    <span>导入备份JSON</span>
                    <input type="file" id="importJsonInput" accept=".json" class="hidden" onchange="importBackup(event)">
                </label>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

        <!-- 汇总概览卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                <div class="text-xs text-slate-500 font-medium mb-1">总收入</div>
                <div id="statIncome" class="text-2xl font-bold text-emerald-600">￥0.00</div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                <div class="text-xs text-slate-500 font-medium mb-1">总支出</div>
                <div id="statExpense" class="text-2xl font-bold text-rose-600">￥0.00</div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                <div class="text-xs text-slate-500 font-medium mb-1">收支结余</div>
                <div id="statBalance" class="text-2xl font-bold text-blue-600">￥0.00</div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                <div class="text-xs text-slate-500 font-medium mb-1">不计收支/理财</div>
                <div id="statNeutral" class="text-2xl font-bold text-slate-500">￥0.00</div>
            </div>
        </div>

        <!-- 账单解析与手动录入面板 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- 批量导入文件 (支持 CSV/Excel/PDF) -->
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm lg:col-span-2">
                <h2 class="text-base font-semibold mb-3 flex items-center space-x-2">
                    <i class="fa-solid fa-file-import text-blue-500"></i>
                    <span>智能账单批量导入 (支持微信 / 支付宝 / 银行卡 Excel·CSV)</span>
                </h2>
                <div class="border-2 border-dashed border-slate-200 rounded-xl p-6 text-center hover:border-blue-400 transition bg-slate-50/50">
                    <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-400 mb-2"></i>
                    <p class="text-slate-600 text-sm mb-1">拖拽或点击上传账单文件 (.xlsx, .xls, .csv)</p>
                    <p class="text-xs text-slate-400 mb-4">自动智能判定分类、过滤说明表头、识别收支与对冲退款</p>
                    <input type="file" id="batchFileInput" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleBatchFileUpload(event)">
                    <button onclick="document.getElementById('batchFileInput').click()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700 transition">
                        选择文件导入
                    </button>
                </div>
            </div>

            <!-- 单笔手动记账 -->
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                <h2 class="text-base font-semibold mb-3 flex items-center space-x-2">
                    <i class="fa-solid fa-pen-to-square text-emerald-500"></i>
                    <span>单笔手动录入</span>
                </h2>
                <form id="singleEntryForm" onsubmit="handleSingleEntry(event)" class="space-y-3 text-sm">
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">交易时间</label>
                        <input type="date" id="formDate" required class="w-full border border-slate-200 rounded-lg px-3 py-1.5 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">商品/说明</label>
                        <input type="text" id="formDesc" placeholder="例如：午餐外卖、交通卡充值" required class="w-full border border-slate-200 rounded-lg px-3 py-1.5 focus:outline-none focus:border-blue-500">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-slate-500 mb-1">金额 (元)</label>
                            <input type="number" step="0.01" id="formAmount" placeholder="0.00" required class="w-full border border-slate-200 rounded-lg px-3 py-1.5 focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-500 mb-1">收/支类型</label>
                            <select id="formType" class="w-full border border-slate-200 rounded-lg px-3 py-1.5 focus:outline-none focus:border-blue-500">
                                <option value="支出">支出</option>
                                <option value="收入">收入</option>
                                <option value="不计收支">不计收支</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">分类</label>
                        <select id="formCategory" class="w-full border border-slate-200 rounded-lg px-3 py-1.5 focus:outline-none focus:border-blue-500">
                            <option value="餐饮美食">餐饮美食</option>
                            <option value="交通出行">交通出行</option>
                            <option value="日用百货">日用百货</option>
                            <option value="服饰装扮">服饰装扮</option>
                            <option value="投资理财">投资理财</option>
                            <option value="转账红包">转账红包</option>
                            <option value="休闲娱乐">休闲娱乐</option>
                            <option value="其他分类">其他分类</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-slate-800 text-white py-2 rounded-lg text-sm hover:bg-slate-900 transition">
                        添加记账
                    </button>
                </form>
            </div>
        </div>

        <!-- 图表分析模块 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-sm font-semibold text-slate-700">支出分类占比</h3>
                    <span class="text-xs text-slate-400">💡 点击饼图分类可联动筛选下方明细</span>
                </div>
                <div class="h-64 cursor-pointer">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                <h3 class="text-sm font-semibold mb-2 text-slate-700">月度支出趋势</h3>
                <div class="h-64">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 明细列表与筛选过滤 -->
        <div id="detailTableSection" class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden transition-all duration-300">
            <div class="p-4 border-b border-slate-100 flex flex-wrap justify-between items-center gap-3">
                <h2 class="text-base font-semibold flex items-center space-x-2">
                    <i class="fa-solid fa-list-check text-indigo-500"></i>
                    <span>交易明细列表</span>
                    <span id="activeCategoryTag" class="hidden bg-blue-100 text-blue-700 text-xs px-2 py-0.5 rounded-full items-center gap-1">
                        <span id="activeCategoryText"></span>
                        <i class="fa-solid fa-xmark cursor-pointer" onclick="clearCategoryFilter()"></i>
                    </span>
                </h2>
                <div class="flex items-center space-x-2">
                    <input type="text" id="searchInput" placeholder="搜索说明或分类..." oninput="renderAll()" class="border border-slate-200 rounded-lg px-3 py-1 text-sm focus:outline-none focus:border-blue-500">
                    <button onclick="clearAllData()" class="text-xs text-rose-500 border border-rose-200 hover:bg-rose-50 px-2 py-1 rounded-lg transition">
                        清空所有数据
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 border-b border-slate-100 text-xs">
                            <th class="p-3">日期</th>
                            <th class="p-3">商品 / 说明</th>
                            <th class="p-3">类型</th>
                            <th class="p-3">分类</th>
                            <th class="p-3 text-right">金额 (元)</th>
                            <th class="p-3 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="transactionTbody" class="divide-y divide-slate-100">
                        <!-- 动态渲染 -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        // 本地数据存储键
        const STORAGE_KEY = 'SMART_BOOKKEEPING_DATA_PRO';
        let transactions = [];
        let categoryChartInstance = null;
        let trendChartInstance = null;

        // 初始化页面
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('formDate').value = new Date().toISOString().slice(0, 10);
            loadLocalData();
            renderAll();
        });

        // 加载本地数据
        function loadLocalData() {
            const data = localStorage.getItem(STORAGE_KEY);
            if (data) {
                try {
                    transactions = JSON.parse(data);
                } catch (e) {
                    transactions = [];
                }
            }
        }

        // 保存本地数据
        function saveLocalData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
            renderAll();
        }

        // 核心 Bug 修复：将 Excel 数字序列号（如 46200.8）转化为“YYYY-MM-DD”标准日期字符串
        function parseExcelDate(excelDate) {
            if (!excelDate) return '';
            
            // 如果已经是标准日期字符串格式 (例如 "2026-07-27")
            if (typeof excelDate === 'string' && excelDate.includes('-')) {
                return excelDate.trim().slice(0, 10);
            }
            if (typeof excelDate === 'string' && excelDate.includes('/')) {
                return excelDate.trim().replace(/\//g, '-').slice(0, 10);
            }

            // 如果是 Excel 浮点型数字序列号 (如 46200.8)
            const num = parseFloat(excelDate);
            if (!isNaN(num)) {
                // Excel 时间以 1900-01-01 为起点，需计算毫秒偏移
                const utcDays = num - 25569;
                const dateObj = new Date(utcDays * 86400 * 1000);
                
                const yyyy = dateObj.getFullYear();
                const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
                const dd = String(dateObj.getDate()).padStart(2, '0');
                return `${yyyy}-${mm}-${dd}`;
            }

            return String(excelDate).trim().slice(0, 10);
        }

        // 单笔新增
        function handleSingleEntry(e) {
            e.preventDefault();
            const date = document.getElementById('formDate').value;
            const desc = document.getElementById('formDesc').value.trim();
            const amount = parseFloat(document.getElementById('formAmount').value) || 0;
            const type = document.getElementById('formType').value;
            const category = document.getElementById('formCategory').value;

            if (!date || !desc || amount <= 0) {
                alert('请填写正确的账单信息与金额！');
                return;
            }

            transactions.unshift({
                id: Date.now().toString(),
                date,
                desc,
                amount,
                type,
                category
            });

            saveLocalData();
            document.getElementById('formDesc').value = '';
            document.getElementById('formAmount').value = '';
        }

        // 智能分类算法
        function detectCategory(desc, type) {
            if (type === '不计收支') return '投资理财';
            if (desc.includes('地铁') || desc.includes('公交') || desc.includes('打车') || desc.includes('出行') || desc.includes('机票') || desc.includes('火车')) return '交通出行';
            if (desc.includes('饭') || desc.includes('外卖') || desc.includes('咖啡') || desc.includes('餐') || desc.includes('瑞幸') || desc.includes('肯德基')) return '餐饮美食';
            if (desc.includes('余额宝') || desc.includes('收益') || desc.includes('理财') || desc.includes('基金')) return '投资理财';
            if (desc.includes('红包') || desc.includes('转账') || desc.includes('benefit')) return '转账红包';
            if (desc.includes('衣') || desc.includes('服饰') || desc.includes('t恤') || desc.includes('鞋')) return '服饰装扮';
            if (desc.includes('烘焙') || desc.includes('日用') || desc.includes('拼豆')) return '日用百货';
            return '其他分类';
        }

        // 批量 Excel/CSV 上传解析
        function handleBatchFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonRows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

                    if (!jsonRows || jsonRows.length === 0) {
                        alert('未能解析到文件内容');
                        return;
                    }

                    // 寻找标题行（包含“交易时间”或“时间”或“金额”）
                    let headerIndex = -1;
                    for (let i = 0; i < jsonRows.length; i++) {
                        const rowStr = JSON.stringify(jsonRows[i]);
                        if (rowStr.includes('时间') || rowStr.includes('金额') || rowStr.includes('商品')) {
                            headerIndex = i;
                            break;
                        }
                    }

                    if (headerIndex === -1) {
                        alert('未能解析到有效的交易记录表头，请检查文件格式！');
                        return;
                    }

                    const headers = jsonRows[headerIndex].map(h => String(h || '').trim());
                    const timeCol = headers.findIndex(h => h.includes('时间') || h.includes('日期'));
                    const descCol = headers.findIndex(h => h.includes('商品') || h.includes('说明') || h.includes('名称') || h.includes('备注'));
                    const amountCol = headers.findIndex(h => h.includes('金额'));
                    const typeCol = headers.findIndex(h => h.includes('收/支') || h.includes('收支') || h.includes('类型'));
                    const catCol = headers.findIndex(h => h.includes('分类'));

                    let importedList = [];
                    for (let i = headerIndex + 1; i < jsonRows.length; i++) {
                        const row = jsonRows[i];
                        if (!row || row.length === 0) continue;

                        // 使用修复后的日期转化函数 parseExcelDate
                        const dateRaw = parseExcelDate(row[timeCol]);
                        const desc = row[descCol] ? String(row[descCol]).trim() : '';
                        const amount = row[amountCol] ? Math.abs(parseFloat(row[amountCol])) : 0;
                        let type = row[typeCol] ? String(row[typeCol]).trim() : '支出';
                        let category = row[catCol] ? String(row[catCol]).trim() : '';

                        if (dateRaw && desc && !isNaN(amount) && amount > 0) {
                            if (!type.includes('收入') && !type.includes('支出') && !type.includes('不计收支')) {
                                type = '支出';
                            }
                            if (!category) {
                                category = detectCategory(desc, type);
                            }
                            importedList.push({
                                id: Date.now().toString() + Math.random().toString().slice(2, 6),
                                date: dateRaw,
                                desc,
                                amount,
                                type,
                                category
                            });
                        }
                    }

                    if (importedList.length > 0) {
                        transactions = importedList.concat(transactions);
                        saveLocalData();
                        alert(`成功导入 ${importedList.length} 条交易记录！已自动修正日期。`);
                    } else {
                        alert('未提取到合规的账单数据');
                    }
                } catch (err) {
                    alert('解析文件出错：' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
            e.target.value = '';
        }

        // 删除单条
        function deleteTransaction(id) {
            if (confirm('确定要删除该笔记录吗？')) {
                transactions = transactions.filter(t => t.id !== id);
                saveLocalData();
            }
        }

        // 清空所有
        function clearAllData() {
            if (confirm('危险操作：确定要清空所有记账记录吗？建议先导出备份！')) {
                transactions = [];
                saveLocalData();
            }
        }

        // 清除当前选中的分类联动过滤
        function clearCategoryFilter() {
            document.getElementById('searchInput').value = '';
            document.getElementById('activeCategoryTag').classList.add('hidden');
            renderAll();
        }

        // 下载标准 Excel 模板
        function downloadTemplate() {
            const sampleData = [
                ["交易时间", "商品/说明", "金额", "收/支", "分类"],
                ["2026-07-27", "上海地铁-一大会址●黄陂南路", 3.6, "支出", "交通出行"],
                ["2026-07-27", "湖南饭店外卖订单", 9.14, "支出", "餐饮美食"],
                ["2026-07-27", "余额宝-收益发放", 1.23, "不计收支", "投资理财"],
                ["2026-07-26", "瑞幸咖啡", 7.4, "支出", "餐饮美食"]
            ];
            const ws = XLSX.utils.aoa_to_sheet(sampleData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "模板");
            XLSX.writeFile(wb, "我的荷包管家模版示例.xlsx");
        }

        // 渲染页面及更新图表
        function renderAll() {
            const searchInput = document.getElementById('searchInput');
            const searchKeyword = searchInput.value.trim().toLowerCase();

            // 更新顶部选中的分类 Tag
            const activeCategoryTag = document.getElementById('activeCategoryTag');
            const activeCategoryText = document.getElementById('activeCategoryText');
            if (searchKeyword) {
                activeCategoryText.innerText = `筛选: ${searchKeyword}`;
                activeCategoryTag.classList.remove('hidden');
                activeCategoryTag.classList.add('flex');
            } else {
                activeCategoryTag.classList.add('hidden');
                activeCategoryTag.classList.remove('flex');
            }

            const filtered = transactions.filter(t => 
                t.desc.toLowerCase().includes(searchKeyword) || 
                t.category.toLowerCase().includes(searchKeyword)
            );

            // 计算汇总
            let totalIncome = 0;
            let totalExpense = 0;
            let totalNeutral = 0;

            filtered.forEach(t => {
                if (t.type === '收入') totalIncome += t.amount;
                else if (t.type === '支出') totalExpense += t.amount;
                else totalNeutral += t.amount;
            });

            document.getElementById('statIncome').innerText = `￥${totalIncome.toFixed(2)}`;
            document.getElementById('statExpense').innerText = `￥${totalExpense.toFixed(2)}`;
            document.getElementById('statBalance').innerText = `￥${(totalIncome - totalExpense).toFixed(2)}`;
            document.getElementById('statNeutral').innerText = `￥${totalNeutral.toFixed(2)}`;

            // 渲染表格
            const tbody = document.getElementById('transactionTbody');
            tbody.innerHTML = '';

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-slate-400">暂无记账明细数据</td></tr>`;
            } else {
                filtered.forEach(t => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-50 transition';

                    let typeBadge = '';
                    let amountColor = '';
                    if (t.type === '支出') {
                        typeBadge = `<span class="bg-rose-50 text-rose-600 px-2 py-0.5 rounded text-xs">支出</span>`;
                        amountColor = 'text-rose-600';
                    } else if (t.type === '收入') {
                        typeBadge = `<span class="bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded text-xs">收入</span>`;
                        amountColor = 'text-emerald-600 font-semibold';
                    } else {
                        typeBadge = `<span class="bg-slate-100 text-slate-500 px-2 py-0.5 rounded text-xs">不计收支</span>`;
                        amountColor = 'text-slate-500';
                    }

                    tr.innerHTML = `
                        <td class="p-3 text-slate-500 whitespace-nowrap">${t.date}</td>
                        <td class="p-3 font-medium text-slate-700">${t.desc}</td>
                        <td class="p-3">${typeBadge}</td>
                        <td class="p-3"><span class="bg-blue-50 text-blue-600 px-2 py-0.5 rounded text-xs cursor-pointer" onclick="filterByCategory('${t.category}')">${t.category}</span></td>
                        <td class="p-3 text-right font-mono ${amountColor}">￥${t.amount.toFixed(2)}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteTransaction('${t.id}')" class="text-slate-400 hover:text-rose-500 transition px-2 py-1">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            renderCharts(transactions); // 图表根据全局数据保持完整结构
        }

        // 分类筛选与跳转动画
        function filterByCategory(categoryName) {
            document.getElementById('searchInput').value = categoryName;
            renderAll();

            // 滚动定位到列表并高亮显示
            const section = document.getElementById('detailTableSection');
            section.scrollIntoView({ behavior: 'smooth' });
            section.classList.add('ring-2', 'ring-blue-400');
            setTimeout(() => {
                section.classList.remove('ring-2', 'ring-blue-400');
            }, 1500);
        }

        // 图表渲染
        function renderCharts(data) {
            // 支出分类统计
            const catMap = {};
            data.filter(t => t.type === '支出').forEach(t => {
                catMap[t.category] = (catMap[t.category] || 0) + t.amount;
            });

            const catLabels = Object.keys(catMap);
            const catValues = Object.values(catMap);

            if (categoryChartInstance) categoryChartInstance.destroy();
            const ctx1 = document.getElementById('categoryChart').getContext('2d');
            categoryChartInstance = new Chart(ctx1, {
                type: 'doughnut',
                data: {
                    labels: catLabels,
                    datasets: [{
                        data: catValues,
                        backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#64748b']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { font: { size: 11 }, boxWidth: 12 } }
                    },
                    // 问题二实现：点击饼图区域直接跳转筛选下方明细
                    onClick: (event, elements) => {
                        if (elements && elements.length > 0) {
                            const index = elements[0].index;
                            const clickedCategory = catLabels[index];
                            filterByCategory(clickedCategory);
                        }
                    }
                }
            });

            // 月度趋势
            const monthMap = {};
            data.filter(t => t.type === '支出').forEach(t => {
                const month = t.date.slice(0, 7);
                if (month) monthMap[month] = (monthMap[month] || 0) + t.amount;
            });

            const monthLabels = Object.keys(monthMap).sort();
            const monthValues = monthLabels.map(m => monthMap[m]);

            if (trendChartInstance) trendChartInstance.destroy();
            const ctx2 = document.getElementById('trendChart').getContext('2d');
            trendChartInstance = new Chart(ctx2, {
                type: 'line',
                data: {
                    labels: monthLabels,
                    datasets: [{
                        label: '月度支出 (元)',
                        data: monthValues,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    }
                }
            });
        }

        // 导出备份 JSON
        function exportBackup() {
            if (transactions.length === 0) { alert('当前没有可导出的数据'); return; }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactions, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", `我的荷包管家备份_${new Date().toISOString().slice(0,10)}.json`);
            dl.click();
            dl.remove();
        }

        // 导入备份 JSON
        function importBackup(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const imported = JSON.parse(evt.target.result);
                    if (Array.isArray(imported)) {
                        if (confirm(`准备恢复 ${imported.length} 条数据，是否覆盖当前所有记账数据？`)) {
                            transactions = imported;
                            saveLocalData();
                            alert('数据已成功恢复！');
                        }
                    } else { alert('备份文件格式有误！'); }
                } catch (err) { alert('解析 JSON 备份文件失败'); }
            };
            reader.readAsText(file);
            e.target.value = '';
        }
    </script>
</body>
</html>
