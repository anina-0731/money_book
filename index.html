<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简智能记账系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
    </style>
</head>
<body class="text-slate-800 pb-12">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-wallet text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900">智能记账系统</h1>
                    <p class="text-xs text-slate-500">本地存储 + JSON 文件安全备份版</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button onclick="exportBackup()" class="flex items-center space-x-1 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg transition border border-slate-300">
                    <i class="fa-solid fa-download"></i>
                    <span class="hidden sm:inline">导出备份</span>
                </button>
                <label class="flex items-center space-x-1 text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-2 rounded-lg transition border border-indigo-200 cursor-pointer">
                    <i class="fa-solid fa-upload"></i>
                    <span class="hidden sm:inline">导入恢复</span>
                    <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importBackup(event)">
                </label>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <div class="text-sm font-medium text-slate-500 mb-1">结余余额</div>
                <div id="netBalance" class="text-2xl font-bold text-slate-900">¥0.00</div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <div class="text-sm font-medium text-emerald-600 mb-1">总收入</div>
                <div id="totalIncome" class="text-2xl font-bold text-emerald-600">¥0.00</div>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <div class="text-sm font-medium text-rose-500 mb-1">总支出</div>
                <div id="totalExpense" class="text-2xl font-bold text-rose-500">¥0.00</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-1 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm h-fit">
                <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center">
                    <i class="fa-solid fa-pen-to-square text-indigo-600 mr-2"></i>记一笔
                </h2>
                <form id="transactionForm" onsubmit="handleAddTransaction(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">交易类型</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" id="btnExpense" onclick="setType('expense')" class="py-2 text-sm font-medium rounded-lg border border-rose-500 bg-rose-500 text-white transition">支出</button>
                            <button type="button" id="btnIncome" onclick="setType('income')" class="py-2 text-sm font-medium rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 transition">收入</button>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">金额 (元)</label>
                        <input type="number" step="0.01" id="amount" required placeholder="0.00" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">用途分类</label>
                        <select id="category" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="餐饮美食">🍔 餐饮美食</option>
                            <option value="交通出行">🚗 交通出行</option>
                            <option value="购物消费">🛍️ 购物消费</option>
                            <option value="日常娱乐">🎮 日常娱乐</option>
                            <option value="居家物业">🏠 居家物业</option>
                            <option value="医疗健康">🏥 医疗健康</option>
                            <option value="职业工资">💰 职业工资</option>
                            <option value="兼职副业">📈 兼职副业</option>
                            <option value="其他">📦 其他</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">交易日期</label>
                        <input type="date" id="date" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">备注/说明</label>
                        <input type="text" id="description" placeholder="例如：买咖啡、发工资..." class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow transition">
                        保存记录
                    </button>
                </form>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h2 class="text-base font-bold text-slate-900 mb-4 flex items-center">
                        <i class="fa-solid fa-chart-pie text-indigo-600 mr-2"></i>支出分类占比
                    </h2>
                    <div class="h-48 relative flex justify-center">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>

                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                        <h2 class="text-base font-bold text-slate-900 flex items-center">
                            <i class="fa-solid fa-list-check text-indigo-600 mr-2"></i>收支交易明细
                        </h2>
                        <span id="recordCount" class="text-xs text-slate-500">共 0 笔</span>
                    </div>

                    <div id="transactionList" class="divide-y divide-slate-100 max-h-96 overflow-y-auto">
                        </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 全局数据状态与当前表单类型
        let transactions = [];
        let currentType = 'expense';
        let chartInstance = null;

        // 页面初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 设置日期输入框默认值为今天
            document.getElementById('date').valueAsDate = new Date();
            // 加载本地数据
            loadLocalData();
        });

        // 切换支出/收入类型切换
        function setType(type) {
            currentType = type;
            const btnExpense = document.getElementById('btnExpense');
            const btnIncome = document.getElementById('btnIncome');

            if (type === 'expense') {
                btnExpense.className = "py-2 text-sm font-medium rounded-lg border border-rose-500 bg-rose-500 text-white transition";
                btnIncome.className = "py-2 text-sm font-medium rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 transition";
            } else {
                btnIncome.className = "py-2 text-sm font-medium rounded-lg border border-emerald-500 bg-emerald-500 text-white transition";
                btnExpense.className = "py-2 text-sm font-medium rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-50 transition";
            }
        }

        // 加载 LocalStorage 本地存储
        function loadLocalData() {
            const saved = localStorage.getItem('smart_accounting_data');
            if (saved) {
                try {
                    transactions = JSON.parse(saved);
                } catch (e) {
                    console.error('本地数据解析失败:', e);
                    transactions = [];
                }
            } else {
                transactions = [];
            }
            renderAll();
        }

        // 保存至 LocalStorage
        function saveLocalData() {
            localStorage.setItem('smart_accounting_data', JSON.stringify(transactions));
            renderAll();
        }

        // 处理新增记录
        function handleAddTransaction(event) {
            event.preventDefault();
            const amount = parseFloat(document.getElementById('amount').value);
            const category = document.getElementById('category').value;
            const date = document.getElementById('date').value;
            const description = document.getElementById('description').value || category;

            if (!amount || amount <= 0) {
                alert("请输入正确的交易金额");
                return;
            }

            const newItem = {
                id: Date.now().toString(),
                type: currentType,
                amount: amount,
                category: category,
                date: date,
                description: description
            };

            transactions.unshift(newItem); // 添加至最前
            saveLocalData();

            // 清空重置表单
            document.getElementById('amount').value = '';
            document.getElementById('description').value = '';
        }

        // 删除某笔交易
        function deleteTransaction(id) {
            if (confirm("确定要删除这条记账记录吗？")) {
                transactions = transactions.filter(item => item.id !== id);
                saveLocalData();
            }
        }

        // 统一渲染界面（计算统计、更新图表、渲染列表）
        function renderAll() {
            let totalIncome = 0;
            let totalExpense = 0;
            const categorySums = {};

            transactions.forEach(item => {
                const val = parseFloat(item.amount) || 0;
                if (item.type === 'income') {
                    totalIncome += val;
                } else {
                    totalExpense += val;
                    categorySums[item.category] = (categorySums[item.category] || 0) + val;
                }
            });

            // 1. 更新顶部卡片数值
            document.getElementById('totalIncome').innerText = `¥${totalIncome.toFixed(2)}`;
            document.getElementById('totalExpense').innerText = `¥${totalExpense.toFixed(2)}`;
            const net = totalIncome - totalExpense;
            const netEl = document.getElementById('netBalance');
            netEl.innerText = `¥${net.toFixed(2)}`;
            netEl.className = `text-2xl font-bold ${net >= 0 ? 'text-slate-900' : 'text-rose-600'}`;

            // 2. 渲染明细列表
            const listEl = document.getElementById('transactionList');
            document.getElementById('recordCount').innerText = `共 ${transactions.length} 笔`;

            if (transactions.length === 0) {
                listEl.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm">暂无记账记录，快在左侧记一笔吧~</div>`;
            } else {
                listEl.innerHTML = transactions.map(item => `
                    <div class="p-4 flex items-center justify-between hover:bg-slate-50 transition">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center ${item.type === 'income' ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}">
                                <i class="fa-solid ${item.type === 'income' ? 'fa-arrow-down' : 'fa-arrow-up'}"></i>
                            </div>
                            <div>
                                <div class="font-medium text-slate-900 text-sm">${item.description}</div>
                                <div class="text-xs text-slate-400">${item.date} · ${item.category}</div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="font-bold text-sm ${item.type === 'income' ? 'text-emerald-600' : 'text-rose-600'}">
                                ${item.type === 'income' ? '+' : '-'}${parseFloat(item.amount).toFixed(2)}
                            </span>
                            <button onclick="deleteTransaction('${item.id}')" class="text-slate-300 hover:text-rose-500 transition p-1">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            }

            // 3. 渲染分类图表
            renderChart(categorySums);
        }

        // 绘制/更新 Chart.js 饼图
        function renderChart(categorySums) {
            const ctx = document.getElementById('categoryChart').getContext('2d');
            const labels = Object.keys(categorySums);
            const data = Object.values(categorySums);

            if (chartInstance) {
                chartInstance.destroy();
            }

            if (labels.length === 0) {
                return;
            }

            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: [
                            '#6366f1', '#ec4899', '#10b981', '#f59e0b',
                            '#3b82f6', '#8b5cf6', '#14b8a6', '#f97316'
                        ],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                font: { size: 11 },
                                boxWidth: 12
                            }
                        }
                    }
                }
            });
        }

        // 导出备份文件 (.json)
        function exportBackup() {
            if (transactions.length === 0) {
                alert("当前没有任何数据可导出！");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactions, null, 2));
            const downloadAnchor = document.createElement('a');
            const fileName = `智能记账系统备份_${new Date().toISOString().slice(0, 10)}.json`;
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", fileName);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // 导入恢复备份数据
        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        if (confirm(`从文件中成功读取到 ${importedData.length} 条数据，是否确认覆盖当前记录？`)) {
                            transactions = importedData;
                            saveLocalData();
                            alert("恢复成功！数据已更新。");
                        }
                    } else {
                        alert("备份文件格式不正确，请选择有效的记账备份 JSON 文件！");
                    }
                } catch (err) {
                    alert("解析文件失败，文件内容格式可能被损坏！");
                }
            };
            reader.readAsText(file);
            // 清空 file input 的值，确保选择相同文件时仍能触发 onchange
            event.target.value = '';
        }
    </script>
</body>
</html>
